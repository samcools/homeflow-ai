<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111d" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>HomeFlow AI</title>
</head>
<body>
  <div id="root"></div>
  <script>
    (()=>{
      let failed=false;
      const showFallback=()=>{
        if(failed)return;
        const root=document.getElementById('root');
        if(root&&root.childElementCount===0){
          failed=true;
          root.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;background:#07111d;color:#fff;font-family:system-ui;padding:24px"><div style="max-width:520px;background:#0a1622;border:1px solid #29445d;border-radius:16px;padding:24px"><h2 style="margin-top:0">HomeFlow could not finish loading</h2><p style="color:#a7b8c8">The application encountered a browser-side error. Your data has not been changed.</p><button onclick="location.reload()" style="border:0;border-radius:10px;background:#4ade80;color:#06110a;font-weight:800;padding:11px 16px;cursor:pointer">Reload HomeFlow</button></div></div>';
        }
      };
      window.addEventListener('error',()=>setTimeout(showFallback,50));
      window.addEventListener('unhandledrejection',()=>setTimeout(showFallback,50));
      setTimeout(showFallback,10000);
    })();
  </script>
  <script type="module" src="/src/portal-stable.tsx"></script>
</body>
</html>
