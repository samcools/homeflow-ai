name: HomeFlow AI CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'upload/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web and API
        run: npm run build
      - name: Run API smoke tests
        run: npm test
